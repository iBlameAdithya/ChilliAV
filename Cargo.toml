[workspace]
resolver = "2"
members = [
    "crates/chilli-core",
    "crates/chilli-agent",
    "crates/chilli-orchestrator",
    "crates/chilli-mcp",
    "crates/chilli-model",
    "crates/chilli-memory",
    "crates/chilli-policy",
    "crates/chilli-verification",
    "crates/chilli-tools",
    "crates/chilli-sandbox",
    "crates/chilli-context",
    "crates/chilli-repo-intel",
    "crates/chilli-analytics",
]

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
futures = "0.3"
blake3 = "1.5"
tree-sitter = "0.22"
tree-sitter-rust = "0.21"
tree-sitter-python = "0.21"
tree-sitter-typescript = "0.21"
walkdir = "2.5"
dirs = "5.0"
tempfile = "3.8"
tokio-stream = "0.1"
crossterm = "0.27"
ratatui = "0.26"
indicatif = "0.17"
regex = "1.10"
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "trace"] }

